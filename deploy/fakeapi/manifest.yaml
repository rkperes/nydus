apiVersion: v1
kind: Namespace
metadata:
  name: nydus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakeapi
  namespace: nydus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fakeapi
  template:
    metadata:
      labels:
        app: fakeapi
    spec:
      containers:
        - name: fakeapi
          image: localhost:5000/fakeapi:0.1.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fakeapi
  namespace: nydus
spec:
  selector:
    app: fakeapi
  ports:
    - port: 8080
      targetPort: 8080
